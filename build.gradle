plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def localModsDirectory = file(providers.gradleProperty('local_mods_dir').get())
def epicFightFile = new File(localModsDirectory, providers.gradleProperty('epic_fight_jar').get())
def punchyFile = new File(localModsDirectory, providers.gradleProperty('punchy_jar').get())

if (!epicFightFile.isFile()) {
    throw new GradleException("Epic Fight development dependency not found: ${epicFightFile}")
}
if (!punchyFile.isFile()) {
    throw new GradleException("Punchy development dependency not found: ${punchyFile}")
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // Punchy ships a production refmap. Remap it only in the Mojang-named
            // development runtime; this setting is not included in the built mod.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
            // Source-set runs do not read the built JAR manifest, so load this
            // mod's optional mixins explicitly during development tests.
            args '--mixin', 'punchyepicfightcompat.mixins.json'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}
    }
}

repositories {
    mavenCentral()
    flatDir {
        dirs localModsDirectory
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // External development inputs only. ForgeGradle remaps them for the dev runtime;
    // neither dependency is shaded or copied into this project's output JAR.
    implementation fg.deobf('local:epic-fight:20.14.17-mc1.20.1-forge')
    compileOnly fg.deobf('local:punchy:2.7c-forge-1.20.1')
    runtimeOnly fg.deobf('local:punchy:2.7c-forge-1.20.1')

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version_range: minecraft_version_range,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': mod_authors,
            'MixinConfigs': 'punchyepicfightcompat.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
}
